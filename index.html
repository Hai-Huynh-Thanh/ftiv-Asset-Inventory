<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    body { background:#f2f4f7; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
    .app-box { max-width: 600px; margin:auto; background:#fff; min-height:100vh; padding:20px; box-shadow:0 0 10px rgba(0,0,0,0.05); }
    .header { display:flex; align-items:center; gap:14px; padding-bottom:12px; border-bottom:2px solid #e0e0e0; }
    .main-title { font-size:18px; font-weight:700; color:#003366; }
    .sub-title { font-size:13px; color:#555; }
    .autocomplete-list li { cursor:pointer; font-size:14px; }
    .autocomplete-list li:hover { background:#f1f5ff; }
    .info-card { background:#f8f9fa; border:1px solid #e9ecef; border-radius:10px; padding:15px; margin-top:15px; }
    .info-label { font-size:12px; color:#6c757d; text-transform:uppercase; font-weight:600; margin-bottom:2px; }
    .info-value { font-size:15px; font-weight:600; color:#212529; margin-bottom:10px; }
  </style>
</head>
<body>

<div class="app-box">

  <div class="header">
    <div class="title">
      <div class="main-title">ỨNG DỤNG KIỂM KÊ TÀI SẢN</div>
      <div class="sub-title">Asset Inventory App</div>
    </div>
  </div>

  <!-- Tìm kiếm Mã TSCĐ -->
  <div class="mt-3 position-relative">
    <label class="form-label fw-bold">Mã TSCĐ / Asset Code</label>
    <input type="text" class="form-control form-control-lg" id="assetCodeInput" placeholder="🔍 Nhập gợi ý (ví dụ: 443)..." autocomplete="off">
    <ul id="assetSuggestList" class="list-group position-absolute w-100 d-none autocomplete-list" style="z-index:1000; max-height:220px; overflow-y:auto;"></ul>
  </div>

  <!-- Thẻ thông tin tài sản chi tiết -->
  <div id="assetDetailWrap" class="d-none">
    <div class="info-card">
      <div class="info-label">Tên TSCĐ / Asset Name</div>
      <div class="info-value text-primary" id="dispAssetName">-</div>

      <div class="row">
        <div class="col-6">
          <div class="info-label">Nhà cung cấp / Supplier</div>
          <div class="info-value" id="dispSupplier">-</div>
        </div>
        <div class="col-6">
          <div class="info-label">Số lượng sổ sách / Qty</div>
          <div class="info-value text-success" id="dispQty">-</div>
        </div>
      </div>

      <div class="row">
        <div class="col-6">
          <div class="info-label">Nơi đặt TS / Room</div>
          <div class="info-value" id="dispRoom">-</div>
        </div>
        <div class="col-6">
          <div class="info-label">Vị trí cụ thể / Position</div>
          <div class="info-value" id="dispPosition">-</div>
        </div>
      </div>
    </div>

    <!-- Ô nhập giá trị kiểm kê thực tế -->
    <div class="mt-3">
      <label class="form-label fw-bold text-danger">Kiểm kê thực tế / Inventory Qty</label>
      <input type="number" class="form-control form-control-lg border-danger" id="inventoryQtyInput" placeholder="Nhập số lượng thực tế..." min="0">
    </div>

    <!-- Nút xác nhận OK -->
    <div class="d-grid my-4">
      <button class="btn btn-success btn-lg shadow-sm" id="btnSubmit" onclick="confirmInventory()">
        ✅ Xác nhận OK
      </button>
    </div>
  </div>

  <!-- Spinner Loading -->
  <div id="loading" class="text-center my-3 d-none">
    <div class="spinner-border text-primary"></div>
    <div class="mt-2 text-muted">Đang kết nối dữ liệu...</div>
  </div>

</div>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>
  // Dán URL Web App của bạn vào đây (Link sau khi Deploy Web App)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby0z_1GSAffPO-vRa0DhcwstdhZjAO5K5lCV90os3JLNlE3v2dhv9JZ99lVeCVZgDaU6g/exec";

  let selectedAsset = null;
  let searchTimeout = null;

  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("assetCodeInput");
    const list = document.getElementById("assetSuggestList");

    // Xử lý sự kiện gõ từ khóa tìm kiếm (Debounce 300ms)
    input.addEventListener("input", () => {
      clearTimeout(searchTimeout);
      const keyword = input.value.trim();

      if (!keyword) {
        list.classList.add("d-none");
        hideAssetDetail();
        return;
      }

      searchTimeout = setTimeout(() => {
        fetchAssetSuggestions(keyword);
      }, 300);
    });
  });

  // Đóng danh sách gợi ý khi click ra ngoài
  document.addEventListener("click", e => {
    if (!e.target.closest(".position-relative")) {
      document.getElementById("assetSuggestList").classList.add("d-none");
    }
  });

  // Gọi API lấy dữ liệu gợi ý từ Google Sheets (dùng JSONP bypass CORS)
  function fetchAssetSuggestions(keyword) {
    showLoading();
    const oldScript = document.getElementById("jsonpScript");
    if (oldScript) oldScript.remove();

    const script = document.createElement("script");
    script.id = "jsonpScript";
    script.src = `${WEB_APP_URL}?action=searchAsset&keyword=${encodeURIComponent(keyword)}&callback=handleAssetSuggestions`;
    script.onerror = () => {
      hideLoading();
      swal("Lỗi", "Không thể kết nối tới Google Sheets", "error");
    };
    document.body.appendChild(script);
  }

  // Nhận dữ liệu kết quả gợi ý
  function handleAssetSuggestions(res) {
    hideLoading();
    const list = document.getElementById("assetSuggestList");
    list.innerHTML = "";

    if (res && res.status === "SUCCESS" && res.data.length > 0) {
      res.data.forEach(item => {
        const li = document.createElement("li");
        li.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";
        li.innerHTML = `<div><strong>${item.assetCode}</strong> - ${item.assetName}</div>`;
        
        li.onclick = () => {
          selectAsset(item);
          list.classList.add("d-none");
        };
        list.appendChild(li);
      });
      list.classList.remove("d-none");
    } else {
      list.classList.add("d-none");
    }
  }

  // Chọn 1 tài sản từ danh sách gợi ý
  function selectAsset(item) {
    selectedAsset = item;
    document.getElementById("assetCodeInput").value = item.assetCode;
    document.getElementById("dispAssetName").textContent = item.assetName || "-";
    document.getElementById("dispSupplier").textContent = item.supplier || "-";
    document.getElementById("dispRoom").textContent = item.room || "-";
    document.getElementById("dispPosition").textContent = item.position || "-";
    document.getElementById("dispQty").textContent = item.qty;

    // Điền sẵn giá trị kiểm kê cũ (nếu có) hoặc để trống
    document.getElementById("inventoryQtyInput").value = item.inventory !== "" ? item.inventory : "";

    document.getElementById("assetDetailWrap").classList.remove("d-none");
    document.getElementById("inventoryQtyInput").focus();
  }

  function hideAssetDetail() {
    selectedAsset = null;
    document.getElementById("assetDetailWrap").classList.add("d-none");
  }

  // Gửi số lượng kiểm kê về Google Sheets
  function confirmInventory() {
    if (!selectedAsset) {
      swal("Chú ý", "Vui lòng chọn tài sản cần kiểm kê", "warning");
      return;
    }

    const inventoryQty = document.getElementById("inventoryQtyInput").value;
    if (inventoryQty === "") {
      swal("Chú ý", "Vui lòng nhập giá trị Kiểm kê thực tế!", "warning");
      return;
    }

    const payload = {
      action: "updateInventory",
      assetCode: selectedAsset.assetCode,
      inventoryQty: Number(inventoryQty)
    };

    showLoading();
    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(res => res.text())
      .then(text => {
        hideLoading();
        const res = JSON.parse(text);
        if (res.status === "SUCCESS") {
          swal("Thành công ✅", res.message, "success").then(() => {
            // Reset form sau khi lưu thành công
            document.getElementById("assetCodeInput").value = "";
            hideAssetDetail();
          });
        } else {
          swal("Lỗi ❌", res.message, "error");
        }
      })
      .catch(err => {
        hideLoading();
        swal("Lỗi mạng", "Không thể cập nhật giá trị kiểm kê", "error");
      });
  }

  function showLoading() { document.getElementById("loading").classList.remove("d-none"); }
  function hideLoading() { document.getElementById("loading").classList.add("d-none"); }
</script>

</body>
</html>
